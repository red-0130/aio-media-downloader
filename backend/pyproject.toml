[project]
name = "all-in-one-downloader-backend"
version = "0.1.0"
description = "Backend services for All-in-One Media Downloader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sse-starlette>=2.1.0",
    "yt-dlp>=2024.8.6",
    "yt-dlp-ejs>=0.8.0",
    "gallery-dl>=1.27.0",
    "pysocks>=1.7.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyffmpeg>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
