upstream backend_api {
    server unix:/tmp/uvicorn.sock;
}

server {
    listen 8000 default_server;
    server_name _;

    client_max_body_size 100M;

    root /app/backend/app/static;
    index index.html;

    # Frontend SPA routes: serve static file or fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API and API documentation endpoints proxied to internal backend
    location ~ ^/(api|docs|redoc|openapi.json) {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming and Server-Sent Events (SSE) configuration
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
